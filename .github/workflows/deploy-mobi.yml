# Build VoiceStudio (CPU/CUDA image = same as upstream :stable) from branch mobi
# and deploy to the Mobi VPS (62.169) via a forced-command SSH key.
name: Deploy Mobi

on:
  push:
    branches: [mobi]

concurrency:
  group: deploy-mobi
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mrpmobi/voicestudio
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    outputs:
      short_sha: ${{ steps.source.outputs.short_sha }}
      image: ${{ steps.source.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve short SHA
        id: source
        shell: bash
        run: |
          short_sha="$(git rev-parse --short=7 HEAD)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}:sha-${short_sha}" >> "$GITHUB_OUTPUT"

      # Torch image hits runner disk ceiling — reclaim unused toolchains (~40 GB).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mobi
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.source.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Default Dockerfile args = CUDA/runtime image used by upstream :stable
          # (CPU hosts run it without a GPU; same image the server uses today).

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Package may need a moment to appear after the first push.
          for i in 1 2 3 4 5; do
            if gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/orgs/mrpmobi/packages/container/voicestudio/visibility" \
              -f visibility=public; then
              echo "package is public"
              exit 0
            fi
            sleep 5
          done
          echo "WARN: could not set package visibility to public" >&2
          exit 0

  deploy:
    needs: build-and-push
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy via SSH forced command
        env:
          DEPLOY_KEY: ${{ secrets.VOICESTUDIO_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VOICESTUDIO_DEPLOY_KNOWN_HOSTS }}
          TAG: sha-${{ needs.build-and-push.outputs.short_sha }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          # Forced command on the server runs voicestudio-deploy; TAG is SSH_ORIGINAL_COMMAND.
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            vsdeploy@62.169.25.190 \
            "$TAG"
